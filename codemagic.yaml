
workflows:
  ios-workflow:
    name: Music Player iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.m3ngsze.sentry.musicplayer
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

      node: v22.12.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build React app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Build iOS app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Debug-iphoneos/*.app
